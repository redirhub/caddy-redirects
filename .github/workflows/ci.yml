name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: spec/v1 is the same as redirhub/integration-spec's
        run: |
          base=https://raw.githubusercontent.com/redirhub/integration-spec/main/spec/v1
          status=0
          for f in rules.txt requests.tsv reports.txt reports.expected.tsv; do
            curl -fsS "$base/$f" -o "$RUNNER_TEMP/$f"
            if ! cmp -s "$RUNNER_TEMP/$f" "spec/v1/$f"; then
              echo "::error file=spec/v1/$f::differs from $base/$f; copy the file over"
              status=1
            fi
          done
          exit $status
      - name: Build Caddy with the module
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          xcaddy build --with github.com/redirhub/caddy-redirects=. --output ./caddy
          ./caddy list-modules | grep -q '^http.handlers.redirects$'
          ./caddy list-modules | grep -q '^tls.permission.redirects$'
          REDIRHUB_INTEGRATION_KEY=test ./caddy validate --config examples/Caddyfile
